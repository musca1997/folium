<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Folium Web Clipper</title>
    <style>
      :root { color-scheme: light; }
      body { width: 340px; margin: 0; padding: 14px; font: 13px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #181818; background: #fff; }
      h1 { margin: 0 0 4px; font-size: 18px; font-weight: 400; }
      p { margin: 0; color: #6d6d6d; }
      label { display: block; margin-top: 10px; font-size: 11px; color: #6d6d6d; }
      input, select { box-sizing: border-box; width: 100%; margin-top: 4px; border: 1px solid #dedede; padding: 7px 8px; font: inherit; color: #181818; background: #fff; outline: none; }
      input:focus, select:focus { border-color: #181818; }
      button { border: 1px solid #181818; background: #fff; color: #181818; padding: 8px 10px; font: inherit; cursor: pointer; }
      button:hover { background: #181818; color: #fff; }
      button.secondary { border-color: #dedede; color: #6d6d6d; }
      button.secondary:hover { border-color: #181818; color: #fff; }
      .row { display: flex; gap: 8px; margin-top: 12px; }
      .row button { flex: 1; }
      .panel { margin-top: 14px; border-top: 1px solid #dedede; padding-top: 12px; }
      .status { margin-top: 10px; min-height: 18px; font-size: 12px; color: #6d6d6d; }
      .url { margin-top: 10px; word-break: break-all; font-size: 12px; color: #6d6d6d; }
    </style>
  </head>
  <body>
    <h1>Folium</h1>
    <p>Save this page to your Folium library.</p>
    <div id="current-url" class="url"></div>

    <label>Visibility
      <select id="visibility">
        <option value="private">Private</option>
        <option value="public">Public</option>
      </select>
    </label>

    <div class="row">
      <button id="save-page">Save page</button>
      <button id="save-selection" class="secondary">Save selection</button>
    </div>

    <div class="panel">
      <label>Folium URL
        <input id="folium-url" placeholder="https://your-folium.example.com" />
      </label>
      <label>Agent API token
        <input id="api-token" type="password" placeholder="folium_xxx" />
      </label>
      <div class="row">
        <button id="save-settings" class="secondary">Save settings</button>
      </div>
    </div>

    <div id="status" class="status"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
